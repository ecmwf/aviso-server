[package]
name = "aviso-server"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
authors = ["Samet Demir <samet.demir@ecmwf.int>",
           "James Hawkes <james.hawkes@ecmwf.int>"]
description = "Notification service for data-driven workflows with live and replay APIs."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ecmwf/aviso-server"
homepage = "https://github.com/ecmwf/aviso-server"
documentation = "https://sites.ecmwf.int/docs/aviso-server/main/"
exclude = [
  ".nui/**",
  ".omo/**",
  "AGENTS.md",
  "aviso-validators/**",
  "aviso-ecpds/**",
  "aviso-intro.md",
  "docs/book/**",
  "nats_config/**",
  "opencode.json",
  "scripts/.nui/**",
  "scripts/.venv/**",
  "scripts/**/__pycache__/**",
  "scripts/**/*.pyc",
  "scripts/nats_config/**",
  "tooling/**",
]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "aviso_server"

[dependencies]
aviso-validators = { version = "=0.11.0", path = "aviso-validators", features = ["openapi"] }
actix-web = { version = "4.15", default-features = false, features = ["macros", "unicode"] }
actix-files = "0.7"
utoipa = { version = "5.5", features = ["actix_extras", "chrono", "uuid"] }
uuid = { version = "1.25", features = ["v4"] }
utoipa-swagger-ui = { version = "9.0", features = ["actix-web"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
config = "0.15"
dirs = "6"
serde-aux = "4.7" # brings extra serde traits
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "json"] }
tracing-log = "0.2"# forwards log crate events to tracing
tracing-actix-web = "0.7"
# OTLP log export (push-based log collection). The appender bridges tracing
# events into the OTel logs pipeline; the exporter ships them over gRPC or
# HTTP to an in-cluster collector.
opentelemetry = { version = "0.32", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"
cloudevents-sdk = "0.9"
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
chrono = "0.4"
time = "0.3"
regex = "1.13"
async-nats = "0.50"
futures = "0.3.34"
futures-util = "0.3.34"
tokio-stream = "0.1"
tokio-util = "0.7"
geo = "0.33"
geo-types = "0.7"
prometheus = { version = "0.14", features = ["process"] }
aviso-ecpds = { version = "=0.11.0", path = "aviso-ecpds", optional = true }

[features]
default = []
ecpds = ["dep:aviso-ecpds"]

[[bench]]
name = "constraint_matcher_benchmark"
harness = false

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
